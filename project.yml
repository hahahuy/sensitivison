name: Sensitivison
options:
  bundleIdPrefix: com.sensitivison
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  TARGETED_DEVICE_FAMILY: "1"
  SUPPORTS_MACCATALYST: "NO"
  INFOPLIST_FILE: Sensitivison/Resources/Info.plist

targets:
  Sensitivison:
    type: application
    platform: iOS
    sources:
      - path: Sensitivison
        excludes:
          - "**/*.md"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sensitivison.app
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      ASSETCATALOG_COMPILER_INCLUDE_APP_ICON: "NO"
    dependencies: []
    scheme:
      testTargets:
        - SensitivisonTests

  SensitivisonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SensitivisonTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sensitivison.tests
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sensitivison.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sensitivison"
    dependencies:
      - target: Sensitivison
